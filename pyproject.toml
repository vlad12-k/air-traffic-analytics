[project]
name = "airtraffic-analytics"
version = "0.2.0"
description = "Reproducible air traffic analytics and decision-intelligence pipeline for airport site selection."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyodbc>=5.3.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "requires_sources: uses locally supplied aviation CSV inputs and is excluded from public CI",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["airtraffic*"]
