<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">UK airport market snapshot — top five by current-period international passengers</title>
  <desc id="desc">An original horizontal bar chart using the CAA May 2022 route-analysis snapshot. It shows the five highest-volume UK airports in the represented 36-airport population.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #52647a; }
    .label { font-size: 20px; font-weight: 600; }
    .value { font-size: 18px; font-weight: 600; }
    .axis { font-size: 14px; fill: #52647a; }
    .footer { font-size: 13px; fill: #36485f; }
    .track { fill: #e9eef5; }
    .bar { fill: #2878c8; }
  </style>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="64" y="62" class="title">UK airport market evidence</text>
  <text x="64" y="94" class="subtitle">Current-period international passengers • CAA route snapshot 202205 (May 2022)</text>
  <text x="64" y="124" class="subtitle">Top five of the 36 UK airports represented in the supplied extract</text>

  <text x="340" y="166" class="axis">Passengers (millions)</text>
  <line x1="340" y1="180" x2="980" y2="180" stroke="#aeb9c8" stroke-width="1"/>
  <line x1="340" y1="176" x2="340" y2="554" stroke="#d5dce6" stroke-width="1"/>
  <line x1="500" y1="176" x2="500" y2="554" stroke="#d5dce6" stroke-width="1"/>
  <line x1="660" y1="176" x2="660" y2="554" stroke="#d5dce6" stroke-width="1"/>
  <line x1="820" y1="176" x2="820" y2="554" stroke="#d5dce6" stroke-width="1"/>
  <line x1="980" y1="176" x2="980" y2="554" stroke="#d5dce6" stroke-width="1"/>
  <text x="340" y="574" text-anchor="middle" class="axis">0</text>
  <text x="500" y="574" text-anchor="middle" class="axis">1.25</text>
  <text x="660" y="574" text-anchor="middle" class="axis">2.5</text>
  <text x="820" y="574" text-anchor="middle" class="axis">3.75</text>
  <text x="980" y="574" text-anchor="middle" class="axis">5.0</text>

  <text x="64" y="226" class="label">1  Heathrow</text>
  <rect x="340" y="198" width="640" height="40" rx="7" class="track"/>
  <rect x="340" y="198" width="640" height="40" rx="7" class="bar"/>
  <text x="1000" y="225" class="value">4,993,568 · 27.77%</text>

  <text x="64" y="300" class="label">2  Gatwick</text>
  <rect x="340" y="272" width="640" height="40" rx="7" class="track"/>
  <rect x="340" y="272" width="362" height="40" rx="7" class="bar"/>
  <text x="1000" y="299" class="value">2,827,573 · 15.72%</text>

  <text x="64" y="374" class="label">3  Stansted</text>
  <rect x="340" y="346" width="640" height="40" rx="7" class="track"/>
  <rect x="340" y="346" width="266" height="40" rx="7" class="bar"/>
  <text x="1000" y="373" class="value">2,074,608 · 11.54%</text>

  <text x="64" y="448" class="label">4  Manchester</text>
  <rect x="340" y="420" width="640" height="40" rx="7" class="track"/>
  <rect x="340" y="420" width="261" height="40" rx="7" class="bar"/>
  <text x="1000" y="447" class="value">2,034,283 · 11.31%</text>

  <text x="64" y="522" class="label">5  Luton</text>
  <rect x="340" y="494" width="640" height="40" rx="7" class="track"/>
  <rect x="340" y="494" width="146" height="40" rx="7" class="bar"/>
  <text x="1000" y="521" class="value">1,138,826 · 6.33%</text>

  <line x1="64" y1="610" x2="1136" y2="610" stroke="#d5dce6" stroke-width="1"/>
  <text x="64" y="640" class="footer">Source: UK Civil Aviation Authority (CAA), Table 12.1, May 2022. Market share is within the represented source population.</text>
  <text x="64" y="662" class="footer">CAA statistics must be referenced and may not be sold or resold. This is a route-analysis snapshot, not annual total airport traffic.</text>
  <text x="64" y="690" class="footer">Original visualization from the permitted GT3 output; it is not a vendor screenshot and remains subject to CAA source terms.</text>
</svg>
