<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">UK airport demand and destination connectivity — Heathrow</title>
  <desc id="desc">An original, vendor-neutral infographic using the CAA May 2022 route-analysis snapshot. Heathrow has 4,993,568 current-period passengers versus 567,162 in the supplied prior period; GT8 reports 99.96 percent scheduled and 0.04 percent charter share, 90 destination countries and 207 destination airports. The chart lists the five largest Heathrow destination-country passenger flows: USA, Germany, Spain, United Arab Emirates and Italy. This is not a Power BI screenshot or an annual terminal-traffic measure.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#52647a}.section{font-size:21px;font-weight:700}.label{font-size:17px}.small{font-size:14px;fill:#52647a}.metric{font-size:30px;font-weight:700}.metriccompact{font-size:26px;font-weight:700}.metriclabel{font-size:14px;fill:#52647a}.barlabel{font-size:16px;font-weight:600}.value{font-size:15px;font-weight:700}.footer{font-size:13px;fill:#36485f}
  </style>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <text x="64" y="67" class="title">UK market demand &amp; connectivity</text>
  <text x="64" y="98" class="sub">HEATHROW · CAA route-analysis snapshot · current period 2022-05 with supplied comparison period</text>
  <rect x="64" y="126" width="1312" height="1" fill="#d5dce6"/>

  <g>
    <rect x="64" y="150" width="292" height="112" rx="12" fill="#ffffff" stroke="#dbe2ec"/>
    <text x="88" y="184" class="metriclabel">Current-period passengers</text>
    <text x="88" y="229" class="metric">4.99M</text>
    <text x="64" y="283" class="small">GT1 · CAA route passenger count</text>

    <rect x="374" y="150" width="292" height="112" rx="12" fill="#ffffff" stroke="#dbe2ec"/>
    <text x="398" y="184" class="metriclabel">Destination countries</text>
    <text x="398" y="229" class="metric">90</text>
    <text x="374" y="283" class="small">GT8 · distinct countries in source snapshot</text>

    <rect x="684" y="150" width="292" height="112" rx="12" fill="#ffffff" stroke="#dbe2ec"/>
    <text x="708" y="184" class="metriclabel">Destination airports</text>
    <text x="708" y="229" class="metric">207</text>
    <text x="684" y="283" class="small">GT8 · distinct destination airports</text>

    <rect x="994" y="150" width="382" height="112" rx="12" fill="#ffffff" stroke="#dbe2ec"/>
    <text x="1018" y="184" class="metriclabel">Scheduled / charter share</text>
    <text x="1018" y="229" class="metriccompact">99.96% / 0.04%</text>
    <text x="994" y="283" class="small">GT8 · shares of current-period route passengers</text>
  </g>

  <rect x="64" y="315" width="570" height="465" rx="14" fill="#ffffff" stroke="#dbe2ec"/>
  <text x="92" y="356" class="section">Passenger demand comparison</text>
  <text x="92" y="383" class="small">Same airport · source-defined periods · scale in millions</text>
  <line x1="270" y1="425" x2="270" y2="700" stroke="#d5dce6"/>
  <line x1="270" y1="700" x2="586" y2="700" stroke="#aeb9c8"/>
  <g stroke="#e8edf4" stroke-width="1">
    <line x1="333" y1="425" x2="333" y2="700"/><line x1="396" y1="425" x2="396" y2="700"/><line x1="459" y1="425" x2="459" y2="700"/><line x1="522" y1="425" x2="522" y2="700"/><line x1="585" y1="425" x2="585" y2="700"/>
  </g>
  <text x="270" y="724" class="small" text-anchor="middle">0</text><text x="333" y="724" class="small" text-anchor="middle">1</text><text x="396" y="724" class="small" text-anchor="middle">2</text><text x="459" y="724" class="small" text-anchor="middle">3</text><text x="522" y="724" class="small" text-anchor="middle">4</text><text x="585" y="724" class="small" text-anchor="middle">5M</text>
  <text x="92" y="502" class="barlabel">Prior period</text>
  <rect x="270" y="470" width="35.85" height="48" rx="7" fill="#9bbde2"/>
  <text x="317" y="501" class="value">567,162</text>
  <text x="92" y="608" class="barlabel">Current</text>
  <rect x="270" y="576" width="315.59" height="48" rx="7" fill="#2878c8"/>
  <text x="270" y="661" class="small">Comparison-period change: +4,426,406 passengers</text>
  <text x="92" y="754" class="small">A very large percentage change is sensitive to the low prior baseline.</text>

  <rect x="660" y="315" width="716" height="465" rx="14" fill="#ffffff" stroke="#dbe2ec"/>
  <text x="688" y="356" class="section">Largest Heathrow destination-country flows</text>
  <text x="688" y="383" class="small">Top five by current-period passengers · bars share one common scale</text>
  <g>
    <text x="688" y="445" class="barlabel">USA</text><rect x="918" y="421" width="360" height="30" rx="6" fill="#2878c8"/><text x="1290" y="443" class="value">1,239,411</text>
    <text x="688" y="507" class="barlabel">Germany</text><rect x="918" y="483" width="99.27" height="30" rx="6" fill="#4a90d9"/><text x="1029" y="505" class="value">341,675</text>
    <text x="688" y="569" class="barlabel">Spain</text><rect x="918" y="545" width="67.86" height="30" rx="6" fill="#4a90d9"/><text x="998" y="567" class="value">233,577</text>
    <text x="688" y="631" class="barlabel">United Arab Emirates</text><rect x="918" y="607" width="64.88" height="30" rx="6" fill="#4a90d9"/><text x="995" y="629" class="value">223,320</text>
    <text x="688" y="693" class="barlabel">Italy</text><rect x="918" y="669" width="61.00" height="30" rx="6" fill="#4a90d9"/><text x="991" y="691" class="value">209,966</text>
  </g>
  <line x1="918" y1="722" x2="1278" y2="722" stroke="#aeb9c8"/>
  <text x="918" y="746" class="small">0</text><text x="1278" y="746" class="small" text-anchor="end">1.24M passengers</text>

  <text x="64" y="822" class="footer">Source: UK Civil Aviation Authority (CAA), Table 12.1 International Air Passenger Traffic Route Analysis, May 2022. Counts are source-reported route passengers.</text>
  <text x="64" y="845" class="footer">CAA source attribution retained; data must not be sold or resold. GT1, GT4 and GT8 outputs; independently authored graphic, not a Power BI/Cognos export.</text>
  <text x="64" y="868" class="footer">Interpretation: demand scale and route breadth support market screening, not retail footfall, conversion, profitability or proof of store viability.</text>
</svg>